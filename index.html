<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aniversário da Helena com tema inspirado no meme clássico da Hebe e visual mágico da Disney Princess."
    />
    <meta property="og:title" content="Helena 15 anos" />
    <meta
      property="og:description"
      content="É que breve completarei 15 anos... mas está com cara de 61."
    />
    <meta property="og:type" content="website" />
    <title>Helena 15 anos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="single-video-page">
        <section class="video-card card" id="videoSection">
          <div class="brand-row">
            <div class="brand">
              <span class="brand-mark">🎉</span>
              <span>Helena 15 anos</span>
            </div>
            <button class="ghost-button" id="copyLinkBtn">Compartilhar</button>
          </div>

          <div class="title-wrap">
            <p class="eyebrow">Meme oficial da festa</p>
            <div class="birthday-badge">🎂 Feliz aniversário, Helena! 🎉</div>
            <h1>É que breve completarei 15 anos...</h1>
            <p class="subtitle">Mas você fará 15 anos e está com cara de 61.</p>
          </div>

          <div class="photo-strip" aria-label="Fotos da Helena">
            <img src="meme-data/fotos-helena/527f0b6d-5de6-4df9-bbae-14234c610ff9.jpg" alt="Helena foto 1" />
            <img src="meme-data/fotos-helena/bc97bccc-f315-4482-9fa2-691086a94796.jpg" alt="Helena foto 2" />
            <img src="meme-data/fotos-helena/0dd720ec-ec64-45fe-b9b8-8e792f164d82.jpg" alt="Helena foto 3" />
            <img src="meme-data/fotos-helena/820f8f88-f595-434b-b18d-a6e0560d1a54.jpg" alt="Helena foto 4" />
            <img src="meme-data/fotos-helena/98e1d950-11d6-44a6-a60d-982be2ff7ad8.jpg" alt="Helena foto 5" />
            <img src="meme-data/fotos-helena/6ba23c09-c32d-4886-850c-3be6b39171c8.jpg" alt="Helena foto 6" />
          </div>

          <div class="video-wrap">
            <video
              id="memeVideo"
              controls
              playsinline
              preload="metadata"
              poster="meme-data/meme-hebe-30.jpg"
            >
              <source src="meme-data/Meme%20Hebe%20-%2015%20Anos.mp4" type="video/mp4" />
              Seu navegador não suporta vídeo HTML5.
            </video>
          </div>

          <div class="video-actions">
            <button class="primary-button" id="replayBtn">Repetir</button>
            <button class="secondary-button" id="shareEventBtn">Compartilhar link</button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
